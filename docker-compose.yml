services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corpusai
      POSTGRES_PASSWORD: corpusai
      POSTGRES_DB: corpusai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://corpusai:corpusai@postgres:5432/corpusai
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: apps/ai-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://corpusai:corpusai@postgres:5432/corpusai
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
